name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read hosted client origin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/example-git/haunt-client/contents/web-deployment.json --jq '.content' | base64 --decode > "$RUNNER_TEMP/web-deployment.json"
          origin=$(python3 -c 'import json,re,sys; value=json.load(open(sys.argv[1])); assert value["version"] == 1; origin=value["origin"]; assert re.fullmatch(r"https://[a-z0-9][a-z0-9.-]*", origin); print(origin)' "$RUNNER_TEMP/web-deployment.json")
          echo "HAUNT_WEB_CLIENT_ORIGIN=$origin" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -ldflags="-X github.com/example-git/haunt-sync/internal/service.HostedClientOrigin=$HAUNT_WEB_CLIENT_ORIGIN" ./...
      - name: Check Python entry points
        run: python3 -m py_compile deploy/entrypoint.py mail-relay/entrypoint.py mail-relay/health.py scripts/check-docs.py scripts/check-repository.py
      - name: Check Compose model
        run: docker compose config --quiet
        env:
          HAUNT_SYNC_HOST: nexus.example.test
          HAUNT_SYNC_TUNNEL_TOKEN: synthetic-configuration-check
          HAUNT_SYNC_UPDATES_PATH: ../.local/sync-updates
      - run: python3 scripts/check-repository.py
      - run: python3 scripts/check-docs.py
      - name: Check history for credentials
        shell: bash
        run: |
          set -euo pipefail
          audit_dir=$(mktemp -d "$RUNNER_TEMP/haunt-sync-audit.XXXXXX")
          trap 'rm -rf "$audit_dir"' EXIT
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$audit_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $audit_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$audit_dir/gitleaks.tar.gz" -C "$audit_dir" gitleaks
          "$audit_dir/gitleaks" git --log-opts='--all --full-history' --redact --no-banner .
